<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>S.H.I.E.L.D. - Access Blocked</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;700&display=swap');
    body {
      font-family: 'Inter', sans-serif;
      background-color: #000000;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }
    .container {
      background-color: #0a0a0a;
      padding: 40px;
      border: 1px solid #333333;
      border-top: 4px solid #ff3333;
      max-width: 600px;
      width: 90%;
    }
    h1 {
      color: #ff3333;
      font-size: 24px;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    p {
      color: #888888;
      font-size: 15px;
      line-height: 1.5;
    }
    .url-box {
      background-color: #171717;
      padding: 16px;
      border: 1px solid #333333;
      word-break: break-all;
      margin: 24px 0;
      font-family: 'JetBrains Mono', monospace;
      color: #ff3333;
      font-size: 14px;
    }
    .btn-container {
      margin-top: 32px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      align-items: center;
    }
    .btn {
      font-family: 'JetBrains Mono', monospace;
      font-weight: bold;
      text-transform: uppercase;
      padding: 12px 24px;
      cursor: pointer;
      width: 100%;
      border: 1px solid;
      transition: all 0.2s;
    }
    .btn-primary {
      background-color: #ffffff;
      color: #000000;
      border-color: #ffffff;
    }
    .btn-primary:hover {
      background-color: transparent;
      color: #ffffff;
    }
    .btn-danger {
      background-color: transparent;
      color: #ff3333;
      border-color: #ff3333;
    }
    .btn-danger:hover {
      background-color: #ff3333;
      color: #000000;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>[ THREAT DETECTED ]</h1>
    <p>This page has been flagged as highly malicious by S.H.I.E.L.D. — Smart Heuristic Intelligence for Evaluating Links & Domains. Visiting it may result in credential theft or malware.</p>
    
    <div class="url-box" id="blockedUrl">Loading...</div>
    
    <div class="btn-container">
      <button id="goBackBtn" class="btn btn-primary">GO BACK SAFELY</button>
      <button id="proceedBtn" class="btn btn-danger">PROCEED ANYWAY (UNSAFE)</button>
    </div>
  </div>
  <script src="blocked.js"></script>
</body>
</html>
