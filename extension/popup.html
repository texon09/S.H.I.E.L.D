<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>S.H.I.E.L.D.</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;700&display=swap');
    
    :root {
      --bg-color: #000000;
      --bg-panel: #0a0a0a;
      --border-color: #333333;
      --text-main: #ffffff;
      --text-muted: #888888;
      
      --safe-color: #00ff66;
      --suspicious-color: #ffcc00;
      --danger-color: #ff3333;
    }

    body {
      background: var(--bg-color);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      margin: 0;
      width: 320px;
      overflow-x: hidden;
      border: 1px solid var(--border-color);
    }

    .mono { font-family: 'JetBrains Mono', monospace; }

    header {
      padding: 16px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg-panel);
    }

    header h1 {
      margin: 0;
      font-size: 16px;
      letter-spacing: 2px;
      font-weight: 700;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--safe-color);
    }

    .container {
      padding: 16px;
    }

    .hidden { display: none !important; }

    /* Cards */
    .panel {
      border: 1px solid var(--border-color);
      padding: 16px;
      margin-bottom: 16px;
      background: var(--bg-panel);
    }

    .verdict-box {
      text-align: center;
      border-top: 4px solid var(--text-muted);
    }

    .score {
      font-size: 48px;
      font-weight: bold;
      line-height: 1;
      margin: 8px 0;
    }

    .tier {
      font-size: 16px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    .url-box {
      font-size: 11px;
      color: var(--text-muted);
      word-break: break-all;
      padding: 8px;
      border: 1px solid var(--border-color);
      background: #000;
      margin-bottom: 16px;
    }

    .finding-row {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      margin-bottom: 8px;
      border-bottom: 1px dashed var(--border-color);
      padding-bottom: 4px;
    }
    .finding-row:last-child { border-bottom: none; }

    .btn {
      width: 100%;
      padding: 12px;
      background: transparent;
      color: var(--text-main);
      border: 1px solid var(--text-main);
      font-family: 'JetBrains Mono', monospace;
      font-weight: bold;
      cursor: pointer;
      text-transform: uppercase;
    }

    .btn:hover {
      background: var(--text-main);
      color: var(--bg-color);
    }

    .spinner {
      width: 24px;
      height: 24px;
      border: 2px solid var(--border-color);
      border-top-color: var(--text-main);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

  </style>
</head>
<body>
  <header>
    <h1>S.H.I.E.L.D.</h1>
    <div class="status-dot" id="system-status"></div>
  </header>

  <div class="container">
    
    <!-- Loader -->
    <div id="loader" style="text-align: center; padding: 40px 0;">
      <div class="spinner"></div>
      <div class="mono" style="font-size: 12px; color: var(--text-muted);">ANALYZING LINK...</div>
    </div>

    <!-- Error -->
    <div id="error-card" class="panel hidden" style="border-top-color: var(--danger-color);">
      <div class="mono" style="color: var(--danger-color); font-size: 12px; margin-bottom: 16px;" id="error-text">
        [ SYSTEM OFFLINE ]<br><br>Cannot connect to local engine.
      </div>
      <button class="btn" id="retry-btn">RETRY CONNECTION</button>
    </div>

    <!-- Results -->
    <div id="result-card" class="hidden">
      
      <div class="url-box mono" id="scanned-url">https://example.com</div>

      <div class="panel verdict-box" id="verdict-box">
        <div class="tier mono" id="verdict-tier">ANALYZING</div>
        <div class="score mono" id="risk-score">--</div>
        <div class="mono" style="font-size: 10px; color: var(--text-muted);" id="warning-text">...</div>
      </div>

      <div class="panel">
        <div class="mono" style="font-size: 12px; margin-bottom: 12px; color: var(--text-muted);">[ SMART LINK ANALYSIS ]</div>
        <div id="findings-list" class="mono">
          <!-- Populated via JS -->
        </div>
      </div>

      <button class="btn" id="close-btn">DISMISS</button>
    </div>

  </div>
  <script src="popup.js"></script>
</body>
</html>
